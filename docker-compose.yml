services:
  netease-music-toolbox:
    image: lmmarisej-netease_url
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "${PORT:-5000}:5000"
    volumes:
      - ./downloads:/app/downloads
      - ./config:/app/config
      - ./logs:/app/logs
    environment:
      - PORT=5000
    restart: unless-stopped
